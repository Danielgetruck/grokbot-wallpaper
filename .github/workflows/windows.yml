# Publishes the public Lively package (lively/dist/grokbot-wallpaper-windows.zip, made by lively/build-public.ps1) as a
# release for a tag like windows-v1.0. Not marked latest, so the Mac .dmg stays the latest download.
# No stored secrets: the release uses the job token. contents: write is only on this release job.
name: Windows package
on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" lively/dist/grokbot-wallpaper-windows.zip --latest=false \
            --title "Grok Bot Wallpaper for Windows ${GITHUB_REF_NAME#windows-v}" \
            --notes "Live Grok Bot wallpaper for Lively Wallpaper (Windows 10 and 11). Install: https://github.com/${{ github.repository }}/blob/main/lively/README.md"
