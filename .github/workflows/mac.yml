# Builds the Mac app (mac/) on a macOS runner: a universal, ad-hoc signed "Grok Bot Wallpaper.app" inside
# GrokBotWallpaper.dmg. Every build keeps the .dmg as a workflow artifact (Actions → run → Artifacts).
# A tag like mac-v1.0 also publishes it as a release. No stored secrets: the release uses the job token.
name: Mac app
on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
    tags: ['mac-v*']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the app and the .dmg
        run: |
          VERSION="0.1.${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then VERSION="${GITHUB_REF#refs/tags/mac-v}"; fi
          VERSION="$VERSION" BUILD_NUMBER="${{ github.run_number }}" bash mac/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GrokBotWallpaper-dmg
          path: mac/dist/GrokBotWallpaper.dmg
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: GrokBotWallpaper-dmg
          path: mac/dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mac/dist/GrokBotWallpaper.dmg \
            --title "Grok Bot Wallpaper for Mac ${GITHUB_REF_NAME#mac-v}" \
            --notes "Live Grok Bot wallpaper for macOS 13+. Install and first launch: https://github.com/${{ github.repository }}/blob/main/mac/README.md"
